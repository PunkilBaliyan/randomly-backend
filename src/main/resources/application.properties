spring.application.name=randomly-backend

# Server configuration
server.address=0.0.0.0
server.port=${PORT:8080}

# Logging configuration
logging.level.root=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.level.com.randomly.backend=DEBUG

# WebSocket settings
spring.websocket.servlet.path=/ws

# Disable Tomcat's default logging
logging.level.org.springframework.boot.web.embedded.tomcat=WARN

# Enable detailed error messages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
